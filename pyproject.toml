[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aemp"
version = "0.7.0"
description = "AI EDA Methodology & QA Platform - deterministic EDA flow, QA and traceability foundation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AEMP Contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# M6.1 HTTP transport (approved): the server is a transport adapter only;
# the deterministic core never imports fastapi/uvicorn.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# M7.2 Methodology MCP Server (approved by the M7.2 spec): the official MCP
# Python SDK, plus httpx for the Platform HTTP calls it adapts and pydantic
# for the tool argument schemas the SDK derives. Adapter only - the
# deterministic core never imports this package, and MCP is never a second
# EDA execution path (no subprocess / Docker / SQLite access).
mcp = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.0",
]

[project.scripts]
aemp = "aemp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aemp = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: real EDA execution in Docker; requires Docker Desktop and the aemp-eda-base image (otherwise skipped)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
