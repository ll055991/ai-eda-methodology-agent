openapi: 3.1.0
info:
  title: AEMP Agent API
  version: 1.1.0
  description: |
    Frontend <-> Agent Backend contract. Synchronous chat; M6.6 adds
    human-in-the-loop approval: a high-risk tool pauses the graph and the
    client decides the pending approval via POST /api/v1/chat/resume.
    SSE streaming remains a later milestone. The Agent is a thin
    interpreter: it plans and explains, and acts on the Platform
    exclusively through the Platform API contract.
servers:
  - url: http://localhost:8100
    description: Reference deployment (Agent Backend lands in M6.2+)

paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Send a natural-language message; receive a synchronous reply
      description: |
        The Agent may call Platform tools (see x-agent-tools) and must
        reference the run(s) behind every factual claim. A reply with
        status=pending_approval is reserved for M6.7.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/agent-chat-request.json
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                $ref: ./schemas/agent-chat-response.json
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json

  /api/v1/chat/resume:
    post:
      operationId: chatResume
      summary: Resume an interrupted execution after a human decision (M6.6)
      description: |
        Decides an EXISTING pending approval (approve or reject) and
        resumes the paused graph. Clients can never name a tool or
        approve one directly; the approval is bound to the exact tool
        call generated by the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/agent-chat-resume-request.json
      responses:
        "200":
          description: Resumed reply (completed/failed/interrupted)
          content:
            application/json:
              schema:
                $ref: ./schemas/agent-chat-response.json
        "400":
          description: INVALID_REQUEST | APPROVAL_MISMATCH
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json
        "404":
          description: APPROVAL_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json
        "409":
          description: APPROVAL_ALREADY_RESOLVED
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: ./schemas/error.json

# ---------------------------------------------------------------------------
# Agent Tool Boundary (normative allowlist).
# The Agent NEVER calls the Platform by importing Python modules; each tool
# maps 1:1 onto a Platform API endpoint. There is deliberately no tool for
# arbitrary commands, arbitrary file access, or direct EDA tool invocation.
# ---------------------------------------------------------------------------
x-agent-tools:
  tools:
    - name: run_flow
      platform_endpoint: /api/v1/flows/run
      description: Execute a named flow spec through the Platform API.
    - name: get_run
      platform_endpoint: /api/v1/runs/{run_id}
      description: Read one run's statuses, metrics and provenance.
    - name: run_qa
      platform_endpoint: /api/v1/runs/{run_id}/qa
      description: Evaluate a named rule pack against a run's metrics.
    - name: get_artifacts
      platform_endpoint: /api/v1/runs/{run_id}/artifacts
      description: List the artifacts recorded by a run.

x-agent-boundary:
  forbidden_capabilities:
    - shell
    - bash
    - subprocess
    - arbitrary_command
    - arbitrary_file_read
  notes: >
    Tools are declarative wrappers over the Platform API. MCP (M6.11) will
    plug into the same Tool Gateway as another transport, not replace it.
